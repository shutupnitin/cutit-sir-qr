<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CutIt.sbs - Login & Shorten URLs</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Antonio', sans-serif;
      text-align: center;
      background: #f9f9f9;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
    }
    .container {
      max-width: 400px;
      margin: auto;
      padding: 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
    input, button {
      width: 100%;
      padding: 1rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background: black;
      color: white;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Login to CutIt.sbs</h1>

    <!-- Login Form -->
    <div id="loginBox">
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Login</button>
      <button onclick="signup()">Sign Up</button>
      <hr/>
      <button onclick="loginWithGoogle()">Sign In with Google</button>
    </div>

    <!-- Logged In UI -->
    <div id="userBox" class="hidden">
      <p>👋 Hello, <span id="userEmail"></span></p>
      <button onclick="goToDashboard()">📊 Go to Dashboard</button>
      <button onclick="logout()">🚪 Logout</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Login with Email
    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) return alert("Fill all fields");
      auth.signInWithEmailAndPassword(email, password)
        .then(() => alert("✅ Logged in"))
        .catch(err => alert("❌ " + err.message));
    }

    // Signup with Email
    function signup() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) return alert("Fill all fields");
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => alert("✅ Account created"))
        .catch(err => alert("❌ " + err.message));
    }

    // Google Login
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(() => alert("✅ Logged in with Google"))
        .catch(err => alert("❌ " + err.message));
    }

    // Logout
    function logout() {
      auth.signOut().then(() => alert("👋 Logged out"));
    }

    // Redirect
    function goToDashboard() {
      window.location.href = "/dashboard.html";
    }

    // Detect Auth State
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("userBox").classList.remove("hidden");
        document.getElementById("userEmail").textContent = user.email;
      } else {
        document.getElementById("loginBox").classList.remove("hidden");
        document.getElementById("userBox").classList.add("hidden");
      }
    });
  </script>
</body>
</html>
