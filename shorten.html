<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CutIt.sbs - Free, unlimited URL shortener & QR code generator. No ads, no watermarks, 100% free." />
  <meta name="keywords" content="URL shortener, QR code generator, free, no watermark, CutIt.sbs" />
  <meta name="robots" content="index, follow" />
  <title>CutIt.sbs - Free Link Shortener & QR Code Generator</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: #000;
      color: #fff;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #111;
    }
    .dark-mode .slider { background-color: #555; }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .shortener-box {
      padding: 1rem;
      max-width: 500px;
      margin: auto;
      background: #f5f5f5;
      border-radius: 8px;
      margin-top: 2rem;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      background: #000;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #222; }
    .qr-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 1rem;
      font-size: 1rem;
      border-radius: 8px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border: 2px solid #000;
      transition: background 0.2s;
    }
    .qr-btn:hover { background: #222; }
    .dark-mode .qr-btn {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .dark-mode {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">CutIt.sbs</div>
    <label class="switch">
      <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
      <span class="slider round"></span>
    </label>
  </header>

  <main>
    <div class="shortener-box">
      <input id="longUrl" placeholder="Paste your long URL here" aria-label="Paste your long URL here">
      <input id="customAlias" placeholder="(Optional) Custom short link e.g. myname" aria-label="Custom short link">
      <button onclick="pasteFromClipboard()">📋 Paste from Clipboard</button>
      <button onclick="generateShortLink()">🚀 Generate Short Link</button>
      <div id="resultBox"></div>
      <div id="shareButtons" style="display:none;">
        <p>🔗 Share this link:</p>
        <a id="shareWhatsApp" target="_blank" rel="noopener">🟢 WhatsApp</a>
        <a id="shareTelegram" target="_blank" rel="noopener">🔵 Telegram</a>
        <a id="shareTwitter" target="_blank" rel="noopener">🐦 Twitter</a>
      </div>
    </div>

    <!-- QR Code Button moved outside -->
    <div style="text-align:center;">
      <a href="https://cutit.sbs" target="_blank" class="qr-btn">📷 Generate QR Code</a>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }
    async function pasteFromClipboard() {
      const text = await navigator.clipboard.readText();
      document.getElementById('longUrl').value = text;
    }
    async function generateShortLink() {
      const longUrl = document.getElementById('longUrl').value.trim();
      const customAlias = document.getElementById('customAlias').value.trim();
      if (!longUrl) return alert('Please enter a URL');

      const shortId = customAlias || Math.random().toString(36).substring(2, 8);
      await db.collection('shortLinks').doc(shortId).set({ url: longUrl });
      const shortUrl = `${window.location.origin}/${shortId}`;
      document.getElementById('resultBox').innerHTML = `<p>Your short link: <a href="${shortUrl}" target="_blank">${shortUrl}</a></p>`;
      document.getElementById('shareButtons').style.display = 'block';
      document.getElementById('shareWhatsApp').href = `https://wa.me/?text=${encodeURIComponent(shortUrl)}`;
      document.getElementById('shareTelegram').href = `https://t.me/share/url?url=${encodeURIComponent(shortUrl)}`;
      document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(shortUrl)}`;
    }
  </script>
</body>
</html>
