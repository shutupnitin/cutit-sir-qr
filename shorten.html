<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8" />
  <meta name="viewport" content="width=device-width, initial‑scale=1.0"/>
  <title>CutIt.sbs – URL Shortener</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app), db = getFirestore(app);

    window.toggleDarkMode = () => document.body.classList.toggle("dark-mode");

    onAuthStateChanged(auth, user => {
      const loginBtn = document.querySelector(".login-btn");
      if (user) {
        loginBtn.textContent = "👤 " + (user.displayName || user.email);
        loginBtn.onclick = () => window.location.href = "dashboard.html";
        localStorage.setItem("cutit_userId", user.displayName || user.email);
      } else {
        loginBtn.textContent = "🔐 Login";
        loginBtn.onclick = () => window.location.href = "login.html";
        localStorage.removeItem("cutit_userId");
      }
    });

    document.getElementById("shortenBtn").addEventListener("click", async () => {
      const url = document.getElementById("longUrl").value.trim();
      const custom = document.getElementById("customAlias").value.trim();
      const isPremium = localStorage.getItem("cutit_isPremium")==="true";
      if(!url) return alert("Please enter a URL.");
      const id = custom || Math.random().toString(36).substring(2,8);
      if(custom && !isPremium) return alert("Unlock premium to use custom alias.");
      try {
        await setDoc(doc(collection(db,"shortlinks"), id), {
          original: url, created: new Date().toISOString(), custom: !!custom
        });
        const shortUrl = `${window.location.origin}/${id}`;
        document.getElementById("resultBox").innerHTML = `✅ Short Link: <a href="${shortUrl}" target="_blank">${shortUrl}</a><br/><button onclick="navigator.clipboard.writeText('${shortUrl}')">📋 Copy</button>`;
      } catch(e){
        console.error(e);
        alert("That custom alias may exist. Try a different one.");
      }
    });

    window.openRazorpay = () => {
      const options = {
        key: "rzp_live_AJEAZ1WJHOpOOQ",
        amount: 19900, currency: "INR",
        name: "CutIt.sbs", description: "Lifetime Premium",
        handler: async resp => {
          alert("Payment successful! Premium unlocked.");
          localStorage.setItem("cutit_isPremium","true");
          await setDoc(doc(collection(db,"premium_users"), resp.razorpay_payment_id), {
            isPremium: true, created: new Date().toISOString()
          });
          unlockPremiumUI();
        },
        theme:{color:"#000"}
      };
      new Razorpay(options).open();
    };

    function unlockPremiumUI(){
      document.querySelectorAll(".premium-only").forEach(el=>el.style.display="block");
    }

    if(localStorage.getItem("cutit_isPremium")==="true"){
      window.addEventListener("DOMContentLoaded", unlockPremiumUI);
    }
  </script>

  <style>
    /* Add your previous styling including dark-mode CSS */
    body{ font-family:Antonio, sans-serif; padding:2rem; }
    .dark-mode{ background:#111; color:#f9f9f9; }
    /* login-btn, toggle-btn, .shortener-box, .features, etc. */
  </style>
</head>
<body>
  <header>
    <div class="logo">CutIt.sbs</div>
    <div>
      <button class="login-btn">🔐 Login</button>
      <button class="toggle-btn" onclick="toggleDarkMode()">🌙</button>
    </div>
  </header>

  <h1>Shorten Your URL</h1>
  <div class="shortener-box">
    <input id="longUrl" placeholder="Your long URL" />
    <input id="customAlias" placeholder="(Optional) Custom alias" />
    <button id="shortenBtn">🚀 Generate</button>
    <div id="resultBox"></div>
  </div>

  <div class="features">
    <div class="feature-card">
      <h3>Premium</h3>
      <button onclick="openRazorpay()">🔓 Unlock Premium – ₹199 Lifetime</button>
      <div class="premium-only" style="display:none">
        <p>🎉 Premium Active</p>
        <button onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
      </div>
    </div>
  </div>
  <footer>© 2025 CutIt.sbs</footer>
</body>
</html>
