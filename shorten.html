<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CutIt.sbs — Free Link Shortener & QR Codes</title>
<meta name="description" content="Shorten links instantly, create free QR codes with no watermark, and share easily. CutIt.sbs is 100% free — always will be." />
<meta name="keywords" content="link shortener, free QR codes, custom short link, no watermark QR, CutIt" />
<meta property="og:title" content="CutIt.sbs — Free Link Shortener & QR Codes" />
<meta property="og:description" content="Shorten links instantly, create free QR codes with no watermark, and share easily." />
<meta property="og:url" content="https://cutit.sbs" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://cutit.sbs/logo.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="CutIt.sbs — Free Link Shortener & QR Codes" />
<meta name="twitter:description" content="Shorten links instantly, create free QR codes with no watermark, and share easily." />
<meta name="twitter:image" content="https://cutit.sbs/logo.png" />
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
body {
  font-family: Arial, sans-serif;
  background: #fff;
  color: #000;
  margin: 0;
  padding: 0;
  transition: background 0.3s, color 0.3s;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem;
}
.logo { font-size: 1.5rem; font-weight: bold; }
.switch {
  position: relative;
  display: inline-block;
  width: 38px;
  height: 20px;
}
.switch input { display: none; }
.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 20px;
}
.slider:before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}
input:checked + .slider { background-color: #111; }
.dark-mode .slider { background-color: #555; }
input:checked + .slider:before { transform: translateX(18px); }
main { max-width: 600px; margin: 2rem auto; text-align: center; }
input[type="url"] {
  width: 80%;
  padding: 0.5rem;
  font-size: 1rem;
  border: 1px solid #ccc;
  border-radius: 6px;
}
button {
  padding: 0.5rem 1rem;
  border: none;
  background: #000;
  color: #fff;
  font-size: 1rem;
  border-radius: 6px;
  cursor: pointer;
}
button:hover { background: #222; }
.result {
  margin-top: 1rem;
  padding: 1rem;
  border: 1px dashed #aaa;
  border-radius: 6px;
}
.qr-btn {
  display: inline-block;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  background: #000;
  color: #fff;
  text-decoration: none;
  margin-top: 0.5rem;
}
.qr-btn:hover { background: #222; }
.dark-mode { background: #000; color: #fff; }
.dark-mode input[type="url"] { background: #222; color: #fff; border-color: #555; }
.dark-mode button { background: #fff; color: #000; }
.dark-mode .qr-btn { background: #fff; color: #000; }
.share-btns a {
  display: inline-block;
  margin: 0.3rem;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  background: #25D366;
  color: #fff;
  text-decoration: none;
}
.share-btns a.telegram { background: #0088cc; }
</style>
</head>
<body>
<header>
  <div class="logo">CutIt.sbs</div>
  <label class="switch">
    <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
    <span class="slider round"></span>
  </label>
</header>
<main>
  <h1>Free Link Shortener</h1>
  <p>Paste your link below and get a short URL instantly. 100% free, no limits.</p>
  <input type="url" id="longUrl" placeholder="Enter your long URL..." />
  <button onclick="generateShortLink()">Shorten</button>
  <div id="resultBox" class="result" style="display:none;"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
  authDomain: "cutitshortener.firebaseapp.com",
  projectId: "cutitshortener",
  storageBucket: "cutitshortener.appspot.com",
  messagingSenderId: "958863508757",
  appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
};
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function generateShortLink() {
  const longUrl = document.getElementById('longUrl').value.trim();
  if (!longUrl) return alert('Please enter a URL.');
  const shortId = Math.random().toString(36).substr(2, 6);
  await db.collection('links').doc(shortId).set({ longUrl });
  const shortUrl = window.location.origin + '/' + shortId;
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('resultBox').innerHTML =
    `<strong>Short URL:</strong> <a href="${shortUrl}" target="_blank">${shortUrl}</a>
     <br/><a href="https://cutit.sbs" target="_blank" class="qr-btn">📷 Generate QR Code</a>
     <div class="share-btns">
       <a href="https://wa.me/?text=${encodeURIComponent(shortUrl)}" target="_blank">WhatsApp</a>
       <a href="https://t.me/share/url?url=${encodeURIComponent(shortUrl)}" target="_blank" class="telegram">Telegram</a>
     </div>`;
}

function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
}
</script>
</body>
</html>
