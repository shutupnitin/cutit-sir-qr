<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | CutIt.sbs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #f7f8fc, #e1e5f2);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 1.8rem;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 1rem;
      background-color: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #333;
    }

    .switch {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
      cursor: pointer;
    }

    .error {
      color: #e74c3c;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .success {
      color: #2ecc71;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="form-title">Login</h1>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button id="auth-btn">Login</button>
    <div class="switch" id="toggle-mode">Don't have an account? Sign up</div>
    <div id="message"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const authBtn = document.getElementById("auth-btn");
    const toggle = document.getElementById("toggle-mode");
    const message = document.getElementById("message");
    const formTitle = document.getElementById("form-title");

    let isLogin = true;

    toggle.addEventListener("click", () => {
      isLogin = !isLogin;
      formTitle.textContent = isLogin ? "Login" : "Sign Up";
      authBtn.textContent = isLogin ? "Login" : "Sign Up";
      toggle.textContent = isLogin
        ? "Don't have an account? Sign up"
        : "Already have an account? Login";
      message.textContent = "";
    });

    authBtn.addEventListener("click", async () => {
      const emailVal = email.value.trim();
      const passwordVal = password.value;

      message.textContent = "";

      if (!emailVal || !passwordVal) {
        message.textContent = "Please enter email and password.";
        message.className = "error";
        return;
      }

      try {
        if (isLogin) {
          await signInWithEmailAndPassword(auth, emailVal, passwordVal);
          message.textContent = "Login successful!";
        } else {
          await createUserWithEmailAndPassword(auth, emailVal, passwordVal);
          message.textContent = "Signup successful!";
        }
        message.className = "success";
      } catch (error) {
        message.textContent = error.message.replace("Firebase: ", "");
        message.className = "error";
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
