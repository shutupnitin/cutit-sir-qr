<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8" />
  <meta name="viewport" content="width=device‑width,initial‑scale=1.0"/>
  <title>Login – CutIt.sbs</title>
  <style>
    body{ font-family:Antonio, sans-serif; display:flex;justify-content:center;align-items:center;height:100vh; }
    .login-box{ text-align:center;padding:2rem;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,0.1); }
    .toggle-btn{ position:absolute;top:20px;right:20px;cursor:pointer; }
    .dark-mode{ background:#111;color:#eee; }
    .dark-mode .login-box{ background:#222;color:white; }
    button{ background:#4285F4;color:#fff;border:none;border-radius:8px;padding:0.8rem 1.5rem;cursor:pointer; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };
    const app = initializeApp(firebaseConfig),
          auth = getAuth(app),
          provider = new GoogleAuthProvider();

    window.toggleDarkMode = () => document.body.classList.toggle("dark-mode");

    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch(e){
        console.error(e);
        alert("Login failed.");
      }
    };

    onAuthStateChanged(auth, user => {
      if(user) window.location.href = "dashboard.html";
    });
  </script>
</head>
<body>
  <div class="toggle-btn" onclick="toggleDarkMode()">🌙 Toggle Mode</div>
  <div class="login-box">
    <h1>Sign in with Google</h1>
    <button onclick="loginWithGoogle()">🔐 Sign In</button>
  </div>
</body>
</html>
