<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting ✦ CutIt.sbs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
    }
    .emoji {
      font-size: 3rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="emoji">🔗</div>
  <h1>Redirecting...</h1>
  <p id="msg">Please wait while we take you to your destination</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ✅ Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.firebasestorage.app",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    // ✅ Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ✅ Get short ID from URL
    const shortId = window.location.pathname.replace("/", "").trim();

    async function redirectNow() {
      if (!shortId || shortId === "index.html") {
        document.getElementById("msg").textContent = "No short link provided.";
        return;
      }

      try {
        const ref = doc(db, "shortlinks", shortId);
        const snap = await getDoc(ref);

        if (snap.exists()) {
          const original = snap.data().original;
          window.location.href = original;
        } else {
          document.getElementById("msg").textContent = "⚠️ Link not found in database.";
        }
      } catch (err) {
        document.getElementById("msg").textContent = "🚨 Error connecting to Firebase.";
        console.error(err);
      }
    }

    redirectNow();
  </script>
</body>
</html>
