<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    .emoji {
      font-size: 2rem;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="emoji">🔗</div>
  <h2>Redirecting...</h2>
  <p id="status"></p>

  <!-- Firebase NON-module SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function redirect() {
      const shortID = window.location.pathname.slice(1); // get /abc123
      document.getElementById("status").textContent = `Looking for ID: ${shortID}`;

      try {
        const docRef = db.collection("shortlinks").doc(shortID);
        const docSnap = await docRef.get();

        if (docSnap.exists) {
          const originalURL = docSnap.data().original;
          window.location.href = originalURL;
        } else {
          document.getElementById("status").innerHTML = "❌ Link not found";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("status").innerHTML = "⚠️ Error connecting to Firebase.";
      }
    }

    redirect();
  </script>
</body>
</html>
