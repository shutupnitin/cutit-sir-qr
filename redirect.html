<!DOCTYPE html>
<html>
  <head><title>Test Redirect</title></head>
  <body>
    <h1>This is redirect.html</h1>
    <p>Path: <span id="path"></span></p>
    <script>
      const path = location.pathname.replace(/^\/+|\/+$/g, '');
      document.getElementById("path").textContent = path;
      console.log("📦 Shortlink path:", path);
    </script>
  </body>
</html>
