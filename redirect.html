<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function redirect() {
      const shortID = window.location.pathname.slice(1); // gets "abc123" from /abc123

      try {
        const docRef = doc(db, "shortlinks", shortID);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const originalURL = docSnap.data().original;
          window.location.href = originalURL;
        } else {
          document.body.innerHTML = "<h2>❌ Link not found</h2>";
        }
      } catch (error) {
        console.error("Error fetching data:", error);
        document.body.innerHTML = "<h2>⚠️ Error connecting to Firebase.</h2>";
      }
    }

    redirect();
  </script>
</head>
<body>
  <h2>Redirecting...</h2>
</body>
</html>
