<!-- Complete CutIt.sbs-Style Dashboard: All Features Enabled -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard • CutIt.sbs</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg-light: #fff;
      --bg-dark: #111;
      --text-light: #111;
      --text-dark: #fff;
      --accent: #ffcc00;
      --gray: #888;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      transition: 0.3s ease;
    }
    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 2px solid #eee;
      font-family: 'Archivo Black', sans-serif;
    }
    .premium-badge {
      background: gold;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 14px;
      margin-left: 10px;
    }
    #links {
      padding: 2rem;
    }
    .link-card {
      background: #f9f9f9;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    body.dark .link-card {
      background: #222;
    }
    button {
      background: black;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 80%;
    }
    #footer {
      text-align: center;
      padding: 2rem;
      font-size: 14px;
      color: var(--gray);
    }
    #darkToggle {
      background: var(--accent);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      CutIt.sbs Dashboard
      <span id="premiumStatus"></span>
    </div>
    <div>
      <button id="darkToggle">🌙 Dark Mode</button>
    </div>
  </header>

  <main id="links">
    <h2>Your Short Links</h2>
    <input id="newUrlInput" type="text" placeholder="Paste your long URL..." />
    <button onclick="createShortLink()">Shorten</button>

    <div id="linkList"></div>

    <h2>Analytics</h2>
    <canvas id="analyticsChart" width="400" height="150"></canvas>

    <br>
    <button onclick="exportCSV()">⬇ Export as CSV</button>
    <input type="file" accept=".csv" onchange="importCSV(event)" />
  </main>
  <div id="footer">
    ✨ Created with love by CutIt.sbs – where QR meets pop culture. ✨
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const linkList = document.getElementById("linkList");
    const chartCtx = document.getElementById("analyticsChart").getContext("2d");

    let userId;
    let chart;

    auth.onAuthStateChanged(async (user) => {
      if (!user) return (window.location.href = "login.html");
      userId = user.uid;
      checkPremiumStatus(userId);
      loadLinks();
    });

    async function checkPremiumStatus(uid) {
      const doc = await db.collection("premium_users").doc(uid).get();
      const premium = doc.exists && doc.data().isPremium;
      document.getElementById("premiumStatus").innerHTML = premium ? `<span class="premium-badge">⭐ Premium</span>` : '';
    }

    async function loadLinks() {
      const snapshot = await db.collection("shortlinks").where("userId", "==", userId).get();
      linkList.innerHTML = "";
      const analytics = {};

      snapshot.forEach((doc) => {
        const { original, custom, clicks = 0, created, expiresAt } = doc.data();
        const short = `https://cutit.sbs/${custom}`;
        const expired = expiresAt && new Date() > new Date(expiresAt);
        linkList.innerHTML += `
          <div class="link-card">
            <b>${short}</b> ${expired ? "<span style='color:red'>(Expired)</span>" : ""}
            <p>Original: <a href="${original}" target="_blank">${original}</a></p>
            <p>Clicks: ${clicks}</p>
            <p>Expires: ${expiresAt ? new Date(expiresAt).toLocaleString() : "Never"}</p>
            <button onclick="copy('${short}')">Copy</button>
            <button onclick="deleteLink('${doc.id}')">Delete</button>
            <button onclick="editLink('${doc.id}', '${custom}')">Edit</button>
            <div id="qr-${doc.id}"></div>
          </div>
        `;
        QRCode.toCanvas(document.getElementById(`qr-${doc.id}`), short);

        analytics[custom] = clicks;
      });

      updateChart(analytics);
    }

    function createShortLink() {
      const original = document.getElementById("newUrlInput").value;
      const custom = Math.random().toString(36).substring(2, 8);
      const now = new Date();
      const expiresAt = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000); // 7 days from now

      db.collection("shortlinks").add({
        original,
        custom,
        userId,
        created: now.toISOString(),
        clicks: 0,
        expiresAt: expiresAt.toISOString()
      }).then(loadLinks);
    }

    function deleteLink(id) {
      db.collection("shortlinks").doc(id).delete().then(loadLinks);
    }

    function editLink(id, oldCustom) {
      const newCustom = prompt("Enter new alias:", oldCustom);
      if (!newCustom || newCustom === oldCustom) return;
      db.collection("shortlinks").doc(id).update({ custom: newCustom }).then(loadLinks);
    }

    function copy(text) {
      navigator.clipboard.writeText(text);
      alert("Copied!");
    }

    function updateChart(data) {
      if (chart) chart.destroy();
      chart = new Chart(chartCtx, {
        type: "bar",
        data: {
          labels: Object.keys(data),
          datasets: [{
            label: "Clicks per Link",
            data: Object.values(data),
            backgroundColor: "#ffcc00"
          }]
        }
      });
    }

    function exportCSV() {
      db.collection("shortlinks").where("userId", "==", userId).get().then(snapshot => {
        let csv = "Short,Original,Clicks,Expires\n";
        snapshot.forEach(doc => {
          const d = doc.data();
          csv += `https://cutit.sbs/${d.custom},${d.original},${d.clicks},${d.expiresAt || "Never"}\n`;
        });
        const blob = new Blob([csv], { type: "text/csv" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "shortlinks.csv";
        link.click();
      });
    }

    function importCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const lines = e.target.result.split("\n").slice(1);
        lines.forEach(line => {
          const [short, original] = line.split(",");
          if (original) {
            db.collection("shortlinks").add({
              original,
              custom: short.split("/").pop(),
              userId,
              created: new Date().toISOString(),
              clicks: 0
            });
          }
        });
        setTimeout(loadLinks, 1000);
      };
      reader.readAsText(file);
    }

    document.getElementById("darkToggle").onclick = () => {
      document.body.classList.toggle("dark");
    };
  </script>
</body>
</html>
