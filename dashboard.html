<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard – CutIt.sbs</title>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Antonio', sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 2rem;
      text-align: center;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logout-btn {
      padding: 0.5rem 1rem;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    h1 {
      margin-top: 1rem;
    }
    .status {
      color: green;
      margin-top: 0.5rem;
    }
    .link-card {
      background: white;
      border: 2px solid #000;
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem auto;
      max-width: 500px;
      text-align: left;
    }
    .link-card a {
      word-break: break-word;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #999;
    }
  </style>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();

    const statusEl = document.getElementById("status");
    const linksContainer = document.getElementById("links");

    // Check auth and premium
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("email").innerText = user.email;

      // Check premium status
      const premiumQuery = query(collection(db, "premium_users"), where("email", "==", user.email));
      const premiumSnap = await getDocs(premiumQuery);
      if (premiumSnap.empty) {
        alert("⛔ You are not a premium user.");
        window.location.href = "index.html";
        return;
      }

      statusEl.innerText = "✅ Premium Access";

      // Fetch links
      const linksQuery = query(collection(db, "shortlinks"), where("uid", "==", user.uid));
      const querySnapshot = await getDocs(linksQuery);
      if (querySnapshot.empty) {
        linksContainer.innerHTML = "<p>No links found.</p>";
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const shortUrl = `https://cutit.sbs/${doc.id}`;
        const original = data.original;
        const clicks = data.clicks || 0;

        const card = document.createElement("div");
        card.className = "link-card";
        card.innerHTML = `
          <strong>Short Link:</strong> <a href="${shortUrl}" target="_blank">${shortUrl}</a><br/>
          <strong>Original:</strong> <span>${original}</span><br/>
          <strong>Clicks:</strong> ${clicks}
        `;
        linksContainer.appendChild(card);
      });
    });

    window.logout = () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    };
  </script>
</head>

<body>
  <header>
    <div>👤 Logged in as <span id="email"></span></div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <h1>📊 Your Dashboard</h1>
  <div class="status" id="status">Checking...</div>

  <section id="links" style="margin-top:2rem;"></section>

  <footer>Dashboard by CutIt.sbs</footer>
</body>
</html>
