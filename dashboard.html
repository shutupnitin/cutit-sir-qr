<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | CutIt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #f9fafb;
      --fg: #111;
      --card: #ffffff;
      --accent: #6366f1;
      --danger: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --fg: #f9fafb;
      --card: #1f2937;
      --accent: #818cf8;
      --danger: #f87171;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      padding-bottom: 4rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 1rem 2rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .premium {
      background: gold;
      color: black;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 10px;
      font-size: 0.75rem;
    }
    .user-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .btn {
      background: var(--accent);
      color: white;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
    }
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    th {
      background: var(--bg);
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f3f4f6;
    }
    [data-theme="dark"] tr:nth-child(even) {
      background-color: #2d2f37;
    }
    .dark-toggle {
      font-size: 1.2rem;
      cursor: pointer;
    }
    .center {
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">CutIt <span class="premium" id="premiumBadge" style="display:none;">Premium</span></div>
    <div class="user-controls">
      <span id="userEmail" style="font-size:0.9rem;"></span>
      <div class="dark-toggle" onclick="toggleTheme()">🌓</div>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="grid">
      <div class="card">
        <h3>✂️ Create Short Link</h3>
        <input type="text" id="originalUrl" placeholder="Original URL">
        <input type="text" id="customAlias" placeholder="Custom Alias (optional)">
        <input type="datetime-local" id="expiration" placeholder="Expiration (optional)">
        <button class="btn" onclick="createLink()">Shorten</button>
      </div>

      <div class="card">
        <h3>📊 Analytics</h3>
        <canvas id="clickChart" height="160"></canvas>
      </div>
    </div>

    <div class="card" style="margin-top:2rem;">
      <h3>🔗 Your Links</h3>
      <table id="linkTable">
        <thead>
          <tr>
            <th>Alias</th>
            <th>Original</th>
            <th>Clicks</th>
            <th>Expires</th>
            <th>QR</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card center" style="margin-top:2rem;">
      <p>Need help? <a href="mailto:vibe@cutit.sbs">Contact Support</a></p>
    </div>
  </main>

  <!-- Firebase + JS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, query, where,
      getDocs, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);

    let userId = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.href = "login.html";
      userId = user.uid;
      document.getElementById("userEmail").textContent = user.email;
      loadLinks();
      checkPremium(userId);
    });

    async function createLink() {
      let rawUrl = document.getElementById("originalUrl").value.trim();
      if (!/^https?:\/\//i.test(rawUrl)) rawUrl = 'https://' + rawUrl;
      const original = rawUrl;
      const custom = document.getElementById("customAlias").value.trim();
      const expiration = document.getElementById("expiration").value;

      if (!original) return alert("Enter a valid URL");

      const payload = {
        original,
        created: serverTimestamp(),
        userId,
        clicks: 0,
        ...(custom && { custom }),
        ...(expiration && { expiration: new Date(expiration) })
      };

      await addDoc(collection(db, "shortlinks"), payload);
      alert("Link created!");
      document.getElementById("originalUrl").value = "";
      document.getElementById("customAlias").value = "";
      document.getElementById("expiration").value = "";
    }

    async function loadLinks() {
      const q = query(collection(db, "shortlinks"), where("userId", "==", userId));
      onSnapshot(q, (snap) => {
        const table = document.querySelector("#linkTable tbody");
        table.innerHTML = "";
        const clicks = [];

        snap.forEach(docSnap => {
          const data = docSnap.data();
          const expires = data.expiration ? new Date(data.expiration.seconds * 1000) : "∞";
          const now = new Date();
          const isExpired = expires !== "∞" && expires < now;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${data.custom || docSnap.id}</td>
            <td><a href="${data.original}" target="_blank">${data.original}</a></td>
            <td>${data.clicks || 0}</td>
            <td>${expires === "∞" ? "∞" : expires.toLocaleString()}</td>
            <td><canvas id="qr-${docSnap.id}" width="50" height="50"></canvas></td>
            <td>
              <button class="btn btn-sm" onclick="copyLink('${data.custom || docSnap.id}')">Copy</button>
              <button class="btn btn-sm" style="background:var(--danger);" onclick="deleteLink('${docSnap.id}')">Delete</button>
            </td>
          `;
          table.appendChild(row);

          if (!isExpired) {
            QRCode.toCanvas(document.getElementById(`qr-${docSnap.id}`), `https://cutit.sbs/${data.custom || docSnap.id}`);
          }

          clicks.push({ x: data.custom || docSnap.id, y: data.clicks || 0 });
        });

        renderChart(clicks);
      });
    }

    function renderChart(data) {
      new Chart(document.getElementById("clickChart"), {
        type: "bar",
        data: {
          labels: data.map(d => d.x),
          datasets: [{
            label: "Clicks",
            data: data.map(d => d.y),
            backgroundColor: "#6366f1"
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    async function deleteLink(id) {
      await deleteDoc(doc(db, "shortlinks", id));
      alert("Deleted");
    }

    function copyLink(id) {
      navigator.clipboard.writeText(`https://cutit.sbs/${id}`);
      alert("Copied!");
    }

    async function checkPremium(uid) {
      const q = query(collection(db, "premium_users"), where("userId", "==", uid));
      const snap = await getDocs(q);
      if (!snap.empty) {
        document.getElementById("premiumBadge").style.display = "inline-block";
      }
    }

    function logout() {
      signOut(auth).then(() => location.href = "login.html");
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    }

    // Load saved theme
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }
  </script>
</body>
</html>
