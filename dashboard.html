<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-70PVFGLP9G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-70PVFGLP9G');
  </script>
  <meta charset="UTF-8" />
  <title>Dashboard | CutIt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f9fafb;
      --fg: #111;
      --card: #fff;
      --accent: #6366f1;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --fg: #f9fafb;
      --card: #1f2937;
      --accent: #818cf8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Antonio', sans-serif;
      transition: background 0.3s, color 0.3s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
      background: var(--card);
    }
    .logo {
      font-weight: 700;
      font-size: 1.6rem;
    }
    .premium {
      background: gold;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-left: 10px;
      color: black;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    .controls button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-family: 'Antonio', sans-serif;
    }
    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 14px;
      margin-bottom: 1.5rem;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      margin-top: 10px;
      margin-bottom: 14px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Antonio', sans-serif;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 10px;
      text-align: left;
      font-family: 'Antonio', sans-serif;
    }
    th {
      background: var(--bg);
    }
    tr:nth-child(even) {
      background: #f3f4f6;
    }
    [data-theme="dark"] tr:nth-child(even) {
      background: #2d2f37;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      margin-right: 4px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Antonio', sans-serif;
    }
    .dark-toggle {
      cursor: pointer;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">CutIt <span class="premium" id="premiumBadge" style="display:none;">Premium</span></div>
    <div class="controls">
      <button onclick="logout()">Logout</button>
      <div class="dark-toggle" onclick="toggleTheme()">🌓</div>
    </div>
  </header>

  <main>
    <div class="card">
      <h3>Create Short Link</h3>
      <input type="text" id="originalUrl" placeholder="Original URL">
      <input type="text" id="customAlias" placeholder="Custom alias (optional)">
      <input type="datetime-local" id="expiration" placeholder="Expiration (optional)">
      <button onclick="createLink()">Shorten</button>
    </div>

    <div class="card">
      <h3>Your Links</h3>
      <table id="linkTable">
        <thead>
          <tr>
            <th>Alias</th>
            <th>Original</th>
            <th>Clicks</th>
            <th>Expires</th>
            <th>QR</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Analytics</h3>
      <canvas id="clickChart" height="120"></canvas>
    </div>

    <div class="card">
      <h3>Bulk Import/Export</h3>
      <input type="file" onchange="importCSV(event)">
      <button onclick="exportCSV()">Export CSV</button>
    </div>

    <div class="card" style="text-align:center">
      <p>Need help? <a href="mailto:support@cutit.sbs">Contact Support</a></p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, query, where,
      getDocs, addDoc, deleteDoc, updateDoc,
      doc, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userId = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userId = user.uid;
        loadLinks();
        checkPremium(userId);
      } else {
        window.location.href = "login.html";
      }
    });

    async function createLink() {
      const original = document.getElementById("originalUrl").value;
      const custom = document.getElementById("customAlias").value.trim();
      const expiration = document.getElementById("expiration").value;
      if (!original) return alert("Enter a valid URL");

      const payload = {
        original,
        created: serverTimestamp(),
        userId,
        clicks: 0,
        ...(custom && { custom }),
        ...(expiration && { expiration: new Date(expiration) })
      };

      await addDoc(collection(db, "shortlinks"), payload);
      alert("Link created!");
      document.getElementById("originalUrl").value = "";
      document.getElementById("customAlias").value = "";
      document.getElementById("expiration").value = "";
    }

    async function loadLinks() {
      const q = query(collection(db, "shortlinks"), where("userId", "==", userId));
      onSnapshot(q, (snap) => {
        const table = document.querySelector("#linkTable tbody");
        table.innerHTML = "";
        const clicks = [];

        snap.forEach(docSnap => {
          const data = docSnap.data();
          const expires = data.expiration ? new Date(data.expiration.seconds * 1000) : "∞";
          const now = new Date();
          const isExpired = expires !== "∞" && expires < now;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${data.custom || docSnap.id}</td>
            <td><a href="${data.original}" target="_blank">${data.original}</a></td>
            <td>${data.clicks || 0}</td>
            <td>${expires === "∞" ? "∞" : expires.toLocaleString()}</td>
            <td><canvas id="qr-${docSnap.id}" width="50" height="50"></canvas></td>
            <td>
              <button class="btn-sm" onclick="copyLink('${data.custom || docSnap.id}')">Copy</button>
              <button class="btn-sm" onclick="deleteLink('${docSnap.id}')">Delete</button>
            </td>
          `;
          table.appendChild(row);

          if (!isExpired) {
            QRCode.toCanvas(document.getElementById(`qr-${docSnap.id}`), `https://cutit.sbs/${data.custom || docSnap.id}`);
          }

          clicks.push({ x: data.custom || docSnap.id, y: data.clicks || 0 });
        });

        renderChart(clicks);
      });
    }

    function renderChart(data) {
      new Chart(document.getElementById("clickChart"), {
        type: "bar",
        data: {
          labels: data.map(d => d.x),
          datasets: [{
            label: "Clicks",
            data: data.map(d => d.y),
            backgroundColor: "#6366f1"
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    async function deleteLink(id) {
      await deleteDoc(doc(db, "shortlinks", id));
      alert("Deleted");
    }

    function copyLink(id) {
      navigator.clipboard.writeText(`https://cutit.sbs/${id}`);
      alert("Copied!");
    }

    async function checkPremium(uid) {
      const q = query(collection(db, "premium_users"), where("userId", "==", uid));
      const snap = await getDocs(q);
      if (!snap.empty) {
        document.getElementById("premiumBadge").style.display = "inline-block";
      }
    }

    function logout() {
      signOut(auth).then(() => window.location.href = "login.html");
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
    }

    function exportCSV() {
      alert("Coming soon: export feature");
    }

    function importCSV(event) {
      alert("Coming soon: import feature");
    }
  </script>
</body>
</html>
