<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CutIt.sbs Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f9f9f9;
      --fg: #111;
      --card: #fff;
      --accent: #000;
      --light-accent: #222;
    }
    [data-theme="dark"] {
      --bg: #111;
      --fg: #f9f9f9;
      --card: #222;
      --accent: #f9f9f9;
      --light-accent: #ddd;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Antonio', sans-serif;
      transition: background 0.3s, color 0.3s;
    }
    header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 1.8rem; font-weight: 700; }
    .controls { display: flex; align-items: center; gap: 1rem; }
    .controls .dark-toggle { cursor: pointer; font-size: 1.2rem; }
    .controls button { background: var(--accent); color: var(--bg); padding: 0.5rem 1rem; border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
    main { max-width:600px; margin:2rem auto; padding:1rem; }
    .card {
      background: var(--card);
      padding:2rem;
      border-radius:12px;
      max-width:500px;
      margin:auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h2 { margin-bottom:1rem; font-size:1.5rem; }
    input {
      width:100%;
      padding:1rem;
      font-size:1rem;
      margin-bottom:0.8rem;
      border:2px solid var(--light-accent);
      border-radius:8px;
      background: var(--bg);
      color: var(--fg);
    }
    button.shorten {
      width:100%;
      padding:1rem;
      font-size:1.1rem;
      background: var(--accent);
      color: var(--bg);
      border:none;
      border-radius:8px;
      cursor:pointer;
    }
    #resultBox { margin-top:1rem; font-size:1.1rem; word-break:break-word; text-align:center; }
  </style>
</head>
<body data-theme="light">
  <header>
    <div class="logo">CutIt.sbs Dashboard</div>
    <div class="controls">
      <span id="userEmail"></span>
      <div class="dark-toggle" onclick="toggleTheme()">🌙</div>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Shorten Your Link</h2>
      <input id="longUrl" placeholder="Paste URL here" />
      <button class="shorten" id="shortenBtn">🚀 Generate Short Link</button>
      <div id="resultBox"></div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "...", authDomain:"...", projectId:"...", storageBucket:"...", messagingSenderId:"...", appId:"..."
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, user => {
      if (!user) return location.href='login.html';
      document.getElementById('userEmail').innerText = user.email;
    });

    document.getElementById('shortenBtn').onclick = async () => {
      let url = document.getElementById('longUrl').value.trim();
      if (!url) return alert('Please enter a URL.');
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const shortID = Math.random().toString(36).substring(2,8);
      await setDoc(doc(collection(db,'shortlinks'), shortID), { original:url, created:new Date().toISOString(), custom:false });
      const shortUrl = `https://${location.hostname}/${shortID}`;
      document.getElementById('resultBox').innerHTML = `✅ Short Link: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
    };

    function logout() {
      signOut(auth).then(() => location.href='login.html');
    }

    function toggleTheme(){
      const cur = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
    }
  </script>
</body>
</html>
