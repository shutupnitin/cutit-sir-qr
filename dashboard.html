<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard • CutIt.sbs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 2rem;
      background: #f9f9f9; color: #111;
      transition: background 0.3s, color 0.3s;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem;
    }
    .btn {
      padding: 0.6rem 1rem;
      background: black; color: white;
      border: none; border-radius: 8px;
      font-weight: 600;
      cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: #333; }
    .link-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }
    .link-card a { font-weight: bold; color: #007aff; word-break: break-word; }
    .controls { margin-top: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .controls button {
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    input[type="text"] {
      padding: 0.8rem;
      width: 100%;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .section {
      max-width: 700px;
      margin: auto;
    }
    #premiumStatus {
      padding: 0.5rem 1rem;
      background: #e0ffe0;
      color: green;
      border: 1px solid green;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: inline-block;
    }
    canvas { max-width: 100%; }
    .dark { background: #111; color: #eee; }
    .dark .link-card, .dark input { background: #222; color: #eee; border-color: #444; }
    .dark .btn { background: #fff; color: #000; }
    .dark .controls button { background: #444; color: #fff; border-color: #666; }
  </style>
</head>
<body>
  <header>
    <h2>✨ Welcome to Your Premium Dashboard</h2>
    <div>
      <button onclick="toggleDark()" class="btn">🌓 Toggle Dark</button>
      <button onclick="logout()" class="btn">🚪 Logout</button>
    </div>
  </header>

  <div class="section">
    <div id="premiumStatus">🔓 You have Premium Access</div>

    <h3>🔗 Create New Short Link</h3>
    <input type="text" id="newLongUrl" placeholder="Enter long URL here">
    <input type="text" id="newCustom" placeholder="(Optional) Custom short path e.g. apple">
    <button onclick="createLink()" class="btn">✂️ Create Short Link</button>

    <hr style="margin: 2rem 0;">

    <h3>📊 Your Link Analytics</h3>
    <canvas id="chartCanvas"></canvas>

    <hr style="margin: 2rem 0;">

    <h3>📁 Your Shortened Links</h3>
    <div id="linkList">Loading...</div>

    <hr style="margin: 2rem 0;">
    <button onclick="window.location.href='mailto:support@cutit.sbs'" class="btn">📧 Contact Support</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const linkList = document.getElementById("linkList");

    let userEmail = "";

    function renderLinks(links) {
      linkList.innerHTML = "";
      const labels = [];
      const clicks = [];

      links.forEach(docSnap => {
        const data = docSnap.data();
        const id = docSnap.id;
        labels.push(id);
        clicks.push(data.clicks || 0);

        const div = document.createElement("div");
        div.className = "link-card";
        div.innerHTML = `
          🔗 <a href="https://cutit.sbs/${id}" target="_blank">cutit.sbs/${id}</a><br/>
          ↪️ ${data.original}<br/>
          ⏱️ Created: ${new Date(data.created).toLocaleString()}<br/>
          📈 Clicks: ${data.clicks || 0}
          <div class="controls">
            <button onclick="copy('${id}')">📋 Copy</button>
            <button onclick="del('${id}')">🗑️ Delete</button>
            <button onclick="qr('${id}')">📸 QR Code</button>
          </div>
        `;
        linkList.appendChild(div);
      });

      new Chart(document.getElementById("chartCanvas"), {
        type: "bar",
        data: {
          labels,
          datasets: [{ label: "Clicks", data: clicks, backgroundColor: "#007aff" }]
        }
      });
    }

    async function loadLinks(email) {
      const q = query(collection(db, "shortlinks"), where("email", "==", email));
      const querySnapshot = await getDocs(q);
      renderLinks(querySnapshot.docs);
    }

    window.copy = async (id) => {
      const short = `https://cutit.sbs/${id}`;
      await navigator.clipboard.writeText(short);
      alert("Copied: " + short);
    };

    window.del = async (id) => {
      if (!confirm("Delete this short link?")) return;
      await deleteDoc(doc(db, "shortlinks", id));
      location.reload();
    };

    window.qr = (id) => {
      const short = `https://cutit.sbs/${id}`;
      const win = window.open("", "_blank");
      win.document.write(`<h3>QR for ${short}</h3><div id="qrcode"></div>`);
      const script = win.document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js";
      script.onload = () => {
        win.QRCode.toCanvas(win.document.getElementById("qrcode"), short);
      };
      win.document.body.appendChild(script);
    };

    window.createLink = async () => {
      const longUrl = document.getElementById("newLongUrl").value.trim();
      const custom = document.getElementById("newCustom").value.trim();
      if (!longUrl) return alert("Please enter URL");
      const id = custom || Math.random().toString(36).substring(2, 8);
      const ref = doc(db, "shortlinks", id);
      await setDoc(ref, {
        original: longUrl,
        created: new Date().toISOString(),
        email: userEmail,
        clicks: 0
      });
      alert("Link created!");
      location.reload();
    };

    window.logout = () => {
      signOut(auth).then(() => {
        localStorage.removeItem("cutit_email");
        location.href = "login.html";
      });
    };

    onAuthStateChanged(auth, user => {
      if (!user) return location.href = "login.html";
      userEmail = user.email;
      loadLinks(user.email);
    });

    window.toggleDark = () => {
      document.body.classList.toggle("dark");
    };
  </script>
</body>
</html>
