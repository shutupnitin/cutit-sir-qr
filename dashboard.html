<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CutIt Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    body {
      font-family: 'SF Pro Display', sans-serif;
      background-color: #f8f9fa;
      transition: background 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: white;
    }
    .container { max-width: 900px; margin-top: 40px; }
    .short-link-box {
      padding: 15px;
      border-radius: 10px;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }
    .dark-mode .short-link-box {
      background: #1f1f1f;
    }
    .btn-primary, .btn-danger, .btn-warning {
      border-radius: 30px;
    }
    .badge-premium {
      background: gold;
      color: black;
      font-weight: bold;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 20px;
    }
    .mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
    }
  </style>
</head>
<body>
  <div class="mode-toggle">
    <button onclick="toggleDarkMode()" class="btn btn-outline-dark">🌙</button>
  </div>

  <div class="container">
    <h2 class="text-center mb-4">👑 CutIt Dashboard <span id="premiumBadge"></span></h2>

    <div class="text-end mb-3">
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
      <button class="btn btn-outline-info" onclick="location.href='mailto:support@cutit.sbs'">📩 Support</button>
    </div>

    <div class="mb-4">
      <input id="linkInput" class="form-control mb-2" placeholder="Paste your long URL here..." />
      <button class="btn btn-primary w-100" onclick="createLink()">Shorten Link</button>
    </div>

    <div id="linksList"></div>

    <h4 class="mt-5">📊 Analytics</h4>
    <canvas id="analyticsChart" height="100"></canvas>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
  authDomain: "cutitshortener.firebaseapp.com",
  projectId: "cutitshortener",
  storageBucket: "cutitshortener.firebasestorage.app",
  messagingSenderId: "958863508757",
  appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser;

    auth.onAuthStateChanged(async user => {
      if (!user) return window.location.href = "login.html";
      currentUser = user;
      loadPremiumStatus();
      loadLinks();
    });

    async function loadPremiumStatus() {
      const doc = await db.collection("premium_users").doc(currentUser.uid).get();
      if (doc.exists && doc.data().isPremium) {
        document.getElementById('premiumBadge').innerHTML = '⭐ Premium User';
        document.getElementById('premiumBadge').className = 'badge-premium';
      }
    }

    async function loadLinks() {
      const query = await db.collection("shortlinks").where("uid", "==", currentUser.uid).get();
      const container = document.getElementById('linksList');
      container.innerHTML = '';
      const dataForChart = [];

      query.forEach(doc => {
        const data = doc.data();
        const created = new Date(data.created?.toDate?.() || data.created);
        const id = doc.id;
        dataForChart.push({ x: created, y: 1 });

        const box = document.createElement("div");
        box.className = "short-link-box";

        box.innerHTML = `
          <div><strong>🔗 cutit.sbs/${id}</strong></div>
          <div>Original: <a href="${data.original}" target="_blank">${data.original}</a></div>
          <div class="mt-2">
            <button class="btn btn-outline-primary btn-sm" onclick="copyToClipboard('${id}')">Copy</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="generateQR('${id}')">QR</button>
            <button class="btn btn-outline-warning btn-sm" onclick="editLink('${id}', '${data.original}')">Edit</button>
            <button class="btn btn-outline-danger btn-sm" onclick="deleteLink('${id}')">Delete</button>
          </div>
        `;
        container.appendChild(box);
      });

      drawChart(dataForChart);
    }

    async function createLink() {
      const url = document.getElementById("linkInput").value;
      if (!url) return alert("Enter a URL");
      const id = Math.random().toString(36).substring(2, 8);
      await db.collection("shortlinks").doc(id).set({
        uid: currentUser.uid,
        original: url,
        created: new Date(),
        custom: false
      });
      document.getElementById("linkInput").value = "";
      loadLinks();
    }

    function logout() {
      auth.signOut().then(() => window.location.href = "login.html");
    }

    function copyToClipboard(id) {
      navigator.clipboard.writeText("https://cutit.sbs/" + id);
      alert("Copied to clipboard!");
    }

    async function deleteLink(id) {
      if (confirm("Delete this short link?")) {
        await db.collection("shortlinks").doc(id).delete();
        loadLinks();
      }
    }

    async function editLink(id, oldURL) {
      const newURL = prompt("Update original URL:", oldURL);
      if (newURL && newURL !== oldURL) {
        await db.collection("shortlinks").doc(id).update({ original: newURL });
        loadLinks();
      }
    }

    function generateQR(id) {
      window.open(`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://cutit.sbs/${id}`, '_blank');
    }

    function drawChart(data) {
      new Chart(document.getElementById("analyticsChart"), {
        type: 'line',
        data: {
          datasets: [{
            label: "Link Creations Over Time",
            data: data,
            borderColor: "#007bff",
            backgroundColor: "rgba(0,123,255,0.2)",
            fill: true
          }]
        },
        options: {
          scales: {
            x: { type: 'time', time: { unit: 'day' } },
            y: { beginAtZero: true }
          }
        }
      });
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }
  </script>
</body>
</html>
