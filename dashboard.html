<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Premium Dashboard – CutIt.sbs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 2rem;
      color: #111;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .link-list {
      max-width: 600px;
      margin: auto;
    }
    .link-item {
      background: #fff;
      border: 1px solid #ddd;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
    }
    .logout-btn {
      background: #000;
      color: white;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      float: right;
    }
  </style>
  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore(app);

    const linkList = document.getElementById("linkList");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      // Check if user is premium
      const premiumRef = collection(db, "premium_users");
      const q = query(premiumRef, where("uid", "==", user.uid));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        alert("❌ You are not a premium user. Please upgrade first.");
        window.location.href = "shorten.html";
        return;
      }

      // Fetch user links
      const linksRef = collection(db, "shortlinks");
      const userLinks = query(linksRef, where("uid", "==", user.uid));
      const userLinksSnap = await getDocs(userLinks);

      const container = document.getElementById("linkList");
      container.innerHTML = "";

      userLinksSnap.forEach(doc => {
        const data = doc.data();
        const item = document.createElement("div");
        item.className = "link-item";
        item.innerHTML = `
          <strong>🔗 ${location.origin}/${doc.id}</strong><br>
          Original: ${data.original}<br>
          Created: ${new Date(data.created).toLocaleString()}
        `;
        container.appendChild(item);
      });
    });

    function logout() {
      const auth = getAuth();
      signOut(auth).then(() => {
        window.location.href = "shorten.html";
      });
    }

    window.logout = logout;
  </script>
</head>
<body>
  <button class="logout-btn" onclick="logout()">Logout</button>
  <h1>🔓 Premium Dashboard</h1>
  <div id="linkList">
    Loading your links...
  </div>
</body>
</html>
