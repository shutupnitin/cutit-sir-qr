<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-70PVFGLP9G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-70PVFGLP9G');
  </script>
  <meta charset="UTF-8" />
  <title>Dashboard | CutIt.sbs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    /* ✅ All styles kept from your main site theme */
    :root {--bg:#f9fafb;--fg:#111;--card:#fff;--accent:#6366f1;}
    [data-theme="dark"] {--bg:#111827; --fg:#f9fafb; --card:#1f2937; --accent:#818cf8;}
    body {margin:0;background:var(--bg);color:var(--fg);font-family:'Antonio',sans-serif;transition:0.3s;}
    header {display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;border-bottom:1px solid #ddd;background:var(--card);}
    .logo {font-weight:700;font-size:1.6rem;}
    .premium{background:gold;padding:4px 10px;border-radius:6px;font-size:0.75rem;margin-left:10px;color:black;}
    .controls {display:flex;gap:10px;}
    .controls button {padding:6px 14px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;}
    main {max-width:900px;margin:2rem auto;padding:1rem;}
    .card{background:var(--card);padding:1.5rem;border-radius:14px;margin-bottom:1.5rem;box-shadow:0 6px 14px rgba(0,0,0,0.06);}
    input,select{width:100%;padding:12px;border:1px solid #ccc;margin:10px 0;border-radius:8px;background:var(--bg);color:var(--fg);}
    table{width:100%;border-collapse:collapse;margin-top:1rem;}
    th,td{padding:10px;text-align:left;font-family:'Antonio',sans-serif;}
    th{background:var(--bg);}
    tr:nth-child(even){background:#f3f4f6;}
    [data-theme="dark"] tr:nth-child(even){background:#2d2f37;}
    .btn-sm{padding:6px 12px;font-size:0.8rem;margin-right:4px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;}
    .dark-toggle{cursor:pointer;font-size:1.2rem;}
    .user-email{font-size:0.9rem;opacity:0.7;}
  </style>
</head>
<body>
  <header>
    <div><span class="logo">CutIt.sbs</span> <span class="user-email" id="userEmail"></span><span class="premium" id="premiumBadge" style="display:none;">Premium</span></div>
    <div class="controls">
      <button onclick="logout()">Logout</button>
      <div class="dark-toggle" onclick="toggleTheme()">🌙</div>
    </div>
  </header>

  <main>
    <!-- Create Link -->
    <div class="card">
      <h3>Create Short Link</h3>
      <input type="text" id="originalUrl" placeholder="Original URL">
      <input type="text" id="customAlias" placeholder="Custom alias (optional)">
      <input type="datetime-local" id="expiration" placeholder="Expiration (optional)">
      <button onclick="createLink()">Shorten</button>
    </div>

    <!-- Links Table -->
    <div class="card">
      <h3>Your Links</h3>
      <table id="linkTable">
        <thead><tr><th>Alias</th><th>Original</th><th>Clicks</th><th>Expires</th><th>QR</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Analytics -->
    <div class="card">
      <h3>Analytics</h3>
      <canvas id="clickChart" height="120"></canvas>
    </div>

    <!-- Import/Export placeholder -->
    <div class="card">
      <h3>Bulk Import/Export</h3>
      <input type="file" onchange="importCSV(event)">
      <button onclick="exportCSV()">Export CSV</button>
    </div>

    <!-- Support -->
    <div class="card" style="text-align:center">
      <p>Need help? <a href="mailto:vibe@cutit.sbs">Contact Support</a></p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, deleteDoc, updateDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = { /* same config */ };
    const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
    let userId = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userId = user.uid;
        document.getElementById('userEmail').textContent = user.email; // show email
        loadLinks();
        checkPremium(userId);
      } else window.location.href = "login.html";
    });

    async function createLink() {
      let rawUrl = document.getElementById("originalUrl").value.trim();
      if (!/^https?:\/\//i.test(rawUrl)) rawUrl = 'https://' + rawUrl;
      const original = rawUrl;
      const custom = document.getElementById("customAlias").value.trim();
      const expiration = document.getElementById("expiration").value;
      if (!original) return alert("Enter a valid URL");

      await addDoc(collection(db, "shortlinks"), {
        original, created: serverTimestamp(), userId, clicks: 0,
        ...(custom && { custom }),
        ...(expiration && { expiration: new Date(expiration) })
      });
      alert("Link created!");
      document.getElementById("originalUrl").value = "";
      document.getElementById("customAlias").value = "";
      document.getElementById("expiration").value = "";
    }

    function loadLinks() {
      const q = query(collection(db, "shortlinks"), where("userId", "==", userId));
      onSnapshot(q, (snap) => {
        const tbody = document.querySelector("#linkTable tbody");
        tbody.innerHTML = "";
        const clicksArr = [];
        snap.forEach(docSnap => {
          const data = docSnap.data();
          const expires = data.expiration ? new Date(data.expiration.seconds * 1000) : "∞";
          const isExpired = expires !== "∞" && expires < new Date();
          const alias = data.custom || docSnap.id;
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${alias}</td>
            <td><a href="${data.original}" target="_blank">${data.original}</a></td>
            <td>${data.clicks||0}</td>
            <td>${isExpired ? expires.toLocaleString() : "∞"}</td>
            <td><canvas id="qr-${docSnap.id}" width="50" height="50"></canvas></td>
            <td>
              <button class="btn-sm" onclick="copyLink('${alias}')">Copy</button>
              <button class="btn-sm" onclick="deleteLink('${docSnap.id}')">Delete</button>
            </td>`;
          tbody.appendChild(row);
          if (!isExpired) QRCode.toCanvas(document.getElementById(`qr-${docSnap.id}`), `https://cutit.sbs/${alias}`);
          clicksArr.push({x:alias, y:data.clicks||0});
        });
        renderChart(clicksArr);
      });
    }

    function renderChart(data) {
      new Chart(document.getElementById("clickChart"), {
        type:"bar", data:{labels:data.map(d=>d.x), datasets:[{label:"Clicks", data:data.map(d=>d.y), backgroundColor:"var(--accent)"}]},
        options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
      });
    }

    async function deleteLink(id) {
      await deleteDoc(doc(db,"shortlinks",id));
      alert("Deleted");
    }

    function copyLink(alias) {
      navigator.clipboard.writeText(`https://cutit.sbs/${alias}`);
      alert("Copied!");
    }

    async function checkPremium(uid) {
      const q = query(collection(db,"premium_users"), where("userId","==",uid));
      const snap = await getDocs(q);
      if (!snap.empty) document.getElementById("premiumBadge").style.display = "inline-block";
    }

    function logout() {
      signOut(auth).then(()=> window.location.href="login.html");
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark");
    }

    function exportCSV(){ alert("Coming soon"); }
    function importCSV(evt){ alert("Coming soon"); }
  </script>
</body>
</html>
