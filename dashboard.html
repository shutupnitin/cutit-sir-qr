<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | CutIt.sbs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f8f9fb;
      color: #333;
    }
    header {
      background: #111;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.2rem;
    }
    .container {
      max-width: 800px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }
    .status {
      margin-bottom: 1rem;
      padding: 1rem;
      background: #eef;
      border-left: 4px solid #00aaff;
      border-radius: 6px;
    }
    .links {
      margin-top: 2rem;
    }
    .link-box {
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      word-break: break-all;
    }
    input, button {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      margin-top: 0.5rem;
    }
    button {
      background: #111;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background: #333;
    }
    .logout-btn, .support-btn {
      background: #ff5252;
      border: none;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 1rem;
    }
    .top-buttons {
      display: flex;
      align-items: center;
      justify-content: end;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to CutIt Dashboard</h1>
    <div class="top-buttons">
      <button class="support-btn" onclick="window.location.href='mailto:support@cutit.sbs'">Contact Support</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="status" id="status">Checking user...</div>

    <h2>Create New Short Link</h2>
    <input type="text" id="longUrl" placeholder="Enter long URL (e.g., https://example.com)" />
    <button onclick="createShortLink()">Shorten</button>

    <div class="links">
      <h2>Your Short Links</h2>
      <div id="linksContainer">Loading...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
      authDomain: "cutitshortener.firebaseapp.com",
      projectId: "cutitshortener",
      storageBucket: "cutitshortener.appspot.com",
      messagingSenderId: "958863508757",
      appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statusDiv = document.getElementById("status");
    const linksContainer = document.getElementById("linksContainer");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "/login.html";
        return;
      }

      statusDiv.textContent = "Logged in as: " + user.email;

      const premiumDoc = await getDoc(doc(db, "premium_users", user.uid));
      if (premiumDoc.exists()) {
        statusDiv.textContent += " ✅ Premium User";
      } else {
        statusDiv.textContent += " ⚠️ Free User - Upgrade for more features!";
      }

      loadUserLinks(user.uid);
    });

    async function loadUserLinks(uid) {
      linksContainer.innerHTML = "";
      const q = query(collection(db, "shortlinks"), where("uid", "==", uid));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        linksContainer.innerHTML = "<p>No links created yet.</p>";
        return;
      }

      snapshot.forEach(doc => {
        const data = doc.data();
        const linkDiv = document.createElement("div");
        linkDiv.className = "link-box";
        linkDiv.innerHTML = `
          <strong>cutit.sbs/${doc.id}</strong><br>
          ➤ ${data.original}
        `;
        linksContainer.appendChild(linkDiv);
      });
    }

    async function createShortLink() {
      const longUrl = document.getElementById("longUrl").value.trim();
      const user = auth.currentUser;
      if (!longUrl || !user) return;

      try {
        const docRef = await addDoc(collection(db, "shortlinks"), {
          original: longUrl,
          uid: user.uid,
          created: serverTimestamp(),
          custom: false
        });

        alert(`Short link created: cutit.sbs/${docRef.id}`);
        document.getElementById("longUrl").value = "";
        loadUserLinks(user.uid);
      } catch (e) {
        alert("Failed to create short link.");
        console.error(e);
      }
    }

    function logout() {
      signOut(auth).then(() => window.location.href = "/login.html");
    }
  </script>
</body>
</html>
