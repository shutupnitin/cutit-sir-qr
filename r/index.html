<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting ✦ CutIt.sbs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }

    .container {
      text-align: center;
      z-index: 1;
    }

    h1 {
      font-size: 2rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.5; transform: scale(0.98); }
    }

    .emoji {
      position: absolute;
      font-size: 2rem;
      animation: float 10s linear infinite;
      pointer-events: none;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fff;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <h1>Redirecting you shortly...</h1>
    <p style="color: #555;">Hang tight 🚀</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ✅ Paste your actual Firebase config here:
    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
  authDomain: "cutitshortener.firebaseapp.com",
  projectId: "cutitshortener",
  storageBucket: "cutitshortener.firebasestorage.app",
  messagingSenderId: "958863508757",
  appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Get the short ID from the URL (e.g., /r/mjtsap)
    const parts = window.location.pathname.split('/');
    const shortId = parts[parts.length - 1];

    // Floating emojis
    const emojis = ['🎈', '🎉', '🚀', '💥', '✨', '🎯'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.className = 'emoji';
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (5 + Math.random() * 5) + 's';
      el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
      document.body.appendChild(el);
    }

    async function redirectToOriginal() {
      try {
        const docRef = doc(db, "shortlinks", shortId); // your Firestore collection name
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const originalUrl = docSnap.data().original;
          setTimeout(() => {
            window.location.href = originalUrl;
          }, 2500);
        } else {
          document.querySelector("h1").innerText = "⚠️ Link not found!";
        }
      } catch (err) {
        console.error("Redirect error:", err);
        document.querySelector("h1").innerText = "⚠️ Something went wrong.";
      }
    }

    redirectToOriginal();
  </script>
</body>
</html>
