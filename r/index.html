<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module">
    // Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCyHnq7dc3ELpVhOQM40jKmKLvRHcCC_Mk",
  authDomain: "cutitshortener.firebaseapp.com",
  projectId: "cutitshortener",
  storageBucket: "cutitshortener.firebasestorage.app",
  messagingSenderId: "958863508757",
  appId: "1:958863508757:web:0d2ff1df8c96fd6368951c"
};
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Get the short ID from URL
    const pathParts = window.location.pathname.split('/');
    const shortId = pathParts[pathParts.length - 1];

    // Look it up in Firestore
    async function redirectToOriginalUrl() {
      const docRef = doc(db, "shortUrls", shortId);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const url = docSnap.data().url;
        window.location.href = url;
      } else {
        document.body.innerHTML = `
          <h2>⚠️ Link not found</h2>
          <p>This short link does not exist or may have expired.</p>
          <a href="/">Go back to homepage</a>
        `;
      }
    }

    redirectToOriginalUrl();
  </script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
    }
  </style>
</head>
<body>
  <h2>⏳ Redirecting you...</h2>
  <p>Please wait a moment.</p>
</body>
</html>
